name: pdf

# Rebuilds cv.pdf / cv.ro.pdf / cv.ru.pdf from the page's print CSS whenever the CV changes, and commits them.
on:
  push:
    branches: [main]
    paths: ['index.html', 'style.css', 'js.js', 'profile.png', 'tools/make-pdf.js', '.github/workflows/pdf.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pdf
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-liberation
      - name: Build the PDFs
        run: node tools/make-pdf.js
      - uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: '*.pdf'
      - name: Commit the PDFs
        run: |
          git add cv.pdf cv.ro.pdf cv.ru.pdf
          if git diff --cached --quiet; then echo "PDFs unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898699+github-actions[bot]@users.noreply.github.com" \
            commit -m "Rebuild CV PDFs [skip ci]"
          git push
